name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - src/pinkrab_description/meshes/**
      - src/pinkrab_umi/meshes/**
      - src/pinkrab_description/print/*.3mf
      - src/pinkrab_umi/print/*.3mf
      - src/pinkrab_umi/print/lens_charuco_a4.*
      - src/pinkrab_studio/pinkrab_studio/static/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
